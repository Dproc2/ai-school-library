<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Դպրոցական ԱԲ գրադարան</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* ----------- Բազային ստիլ ----------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: #0b1120;
  color: #e5e7eb;
}
a { color: #93c5fd; text-decoration: none; }
a:hover { text-decoration: underline; }

/* ----------- Header ----------- */
header {
  background: linear-gradient(135deg, #2563eb, #1e3a8a);
  padding: 40px 20px;
  text-align: center;
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
header h1 { font-size: 38px; font-weight: 700; margin-bottom: 10px; }
header p { font-size: 18px; opacity: 0.85; }

/* ----------- Container ----------- */
.container {
  max-width: 1200px;
  margin: 40px auto;
  padding: 20px;
}

/* ----------- Ընտրության բաժին ----------- */
.select-group {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 20px;
  margin-bottom: 30px;
}
select, button {
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  transition: 0.3s;
}
select {
  background: #020617;
  color: #e5e7eb;
  border: 1px solid #334155;
}
button {
  background: #2563eb;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}
button:hover { background: #1d4ed8; }

/* ----------- Արդյունքների բաժին ----------- */
.result {
  margin-top: 40px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}
.card {
  background: #1e293b;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  transition: transform 0.3s, box-shadow 0.3s;
}
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.6);
}
.card h3 { color: #60a5fa; margin-bottom: 12px; font-weight: 600; }
.card p { margin-bottom: 12px; line-height: 1.5; }

/* ----------- Footer ----------- */
footer {
  text-align: center;
  margin-top: 60px;
  padding: 20px;
  opacity: 0.6;
  border-top: 1px solid #334155;
}
</style>
</head>

<body>
<header>
  <h1>📚 Դպրոցական ԱԲ գրադարան</h1>
  <p>Ընտրիր դասարանն ու բաժինը՝ գտնելու համար ուսումնական նյութերը</p>
</header>

<div class="container">
  <div class="select-group">
    <select id="grade">
      <option value="">Ընտրել դասարանը</option>
      <option value="6">6-րդ դասարան</option>
      <option value="7">7-րդ դասարան</option>
      <option value="8">8-րդ դասարան</option>
      <option value="9">9-րդ դասարան</option>
      <option value="10">10-րդ դասարան</option>
      <option value="11">11-րդ դասարան</option>
    </select>

    <select id="section">
      <option value="">Ընտրել բաժինը</option>
      <option value="books">Գրքեր</option>
      <option value="materials">Նյութեր</option>
      <option value="tests">Թեստեր</option>
      <option value="projects">Նախագծեր</option>
    </select>

    <button onclick="showSection()">🎯 Ընտրել</button>
  </div>

  <div class="select-group" id="subjectGroup" style="display:none;">
    <select id="subject">
      <option value="">Ընտրել առարկան</option>
    </select>
    <button onclick="showMaterials()">🔍 Գտնել նյութերը</button>
  </div>

  <div class="result" id="result"></div>
</div>

<footer>
  © 2026 | ԱԲ նախագծային աշխատանք
</footer>

<script>
// ---------- Տվյալների սկզբնական բազա ----------
const library = {
  "6": {
    "books": {
      "math": { title:"Մաթեմատիկա", links:[{title:"Մաթեմատիկա դասագիրք", url:"#"}] },
      "armenian": { title:"Հայոց լեզու", links:[{title:"Հայոց լեզու դասագիրք", url:"#"}] }
    },
    "materials": {
      "math": { title:"Մաթեմատիկա նյութեր", links:[{title:"Մաթեմատիկա բացատրություններ", url:"#"}] },
      "armenian": { title:"Հայոց լեզու նյութեր", links:[{title:"Հայոց լեզու բացատրություններ", url:"#"}] }
    },
    "tests": {},
    "projects": {}
  },
  "7": {
    "books": {},
    "materials": {},
    "tests": {},
    "projects": {}
  }
  // Ավելացնենք 8–11 դասարանները հետագայում
};

// ---------- Dropdown-ների JS ----------
function showSection(){
  const grade = document.getElementById("grade").value;
  const section = document.getElementById("section").value;
  const subjectGroup = document.getElementById("subjectGroup");
  const subjectSelect = document.getElementById("subject");

  if(!grade || !section){ alert("Խնդրում ենք ընտրել դասարան և բաժին"); return; }

  // Մաքրել առարկաների dropdown
  subjectSelect.innerHTML = '<option value="">Ընտրել առարկան</option>';

  const subjects = library[grade][section];
  for(let key in subjects){
    let opt = document.createElement("option");
    opt.value = key;
    opt.textContent = subjects[key].title;
    subjectSelect.appendChild(opt);
  }

  subjectGroup.style.display = "grid";
  document.getElementById("result").innerHTML = "";
}

function showMaterials(){
  const grade = document.getElementById("grade").value;
  const section = document.getElementById("section").value;
  const subject = document.getElementById("subject").value;
  const result = document.getElementById("result");

  if(!subject){ alert("Խնդրում ենք ընտրել առարկան"); return; }

  const data = library[grade][section][subject];
  if(!data){ result.innerHTML = "<p>⚠️ Տվյալներ դեռ չկան</p>"; return; }

  let html = "";
  data.links.forEach(link=>{
    html += `<li><a href="${link.url}" target="_blank">${link.title}</a></li>`;
  });

  result.innerHTML = `
    <div class="card">
      <h3>${data.title}</h3>
      <ul>${html}</ul>
    </div>
  `;
}
</script>
</body>
</html>
